backend :
  title : 核心Demo
  groups :
    setting :
      title : 核心Demo注入
      icon : 'bi bi-box-fill'
      children :
        -
          title : 主页
          icon : 'bi bi-box'
          url : http://www.baidu.com
demo :
  title : Demo
  groups :
    -
      title : Helper(帮助)
      children :
        -
          title : EnvHelper
          route : demo:web.helper.env
        -
          title : ImageHelper
          route : demo:web.helper.image
        -
          title : TreeHelper
          route : demo:web.helper.tree
    -
      title : 邮箱
      children :
        -
          title : TestMail
          route : demo:web.mail.index
    -
      title : Table
      children :
        -
          title : 简易表格
          route : demo:web.table.easy
        -
          title : 手动表格
          route : demo:web.table.manual
    -
      title : Grid
      children :
        -
          title : Content
          route : demo:web.content.index
        -
          title : Grid Demo
          route : demo:web.grid.index
          route_param :
            - demo
        -
          title : Grid Edit
          route : demo:web.grid.index
          route_param :
            - edit
        -
          title : Grid Index
          route : demo:web.grid.index
          route_param :
            - index
        -
          title : Grid User
          route : demo:web.grid.index
          route_param :
            - user
        -
          title : Grid Operation
          route : demo:web.grid.index
          route_param :
            - operation
        -
          title : Grid No File
          route : demo:web.grid.no_file
    -
      title : 前端文档
      children :
        -
          title : 提示/对话框
          route : demo:web.js.index
    -
      title : Form
      children :
        -
          title : 表单
