backend :
  title : Demo
  groups :
    -
      title : '框架'
      children :
        -
          title : Helper(帮助)
          children :
            -
              title : EnvHelper
              route : demo:web.helper.env
              permission : backend:demo.help.manage
demo :
  title : Demo
  groups :
    -
      title : '框架'
      children :
        -
          title : Helper(帮助)
          children :
            -
              title : EnvHelper
              route : demo:web.helper.env
            -
              title : ImageHelper
              route : demo:web.helper.image
            -
              title : TreeHelper
              route : demo:web.helper.tree
        -
          title : 地址形式
          children :
            -
              title : 绝对地址
              icon : 'bi bi-link-45deg'
              url : https://wulicode.com/
            -
              title : 相对地址
              icon : 'bi bi-link'
              url : /demo/helper/image
            -
              title : 组合地址(多行)
              icon : 'bi bi-link'
              route : demo:web.home.output
              route_param :
                - multi-line
            -
              title : 组合地址(单行)
              icon : 'bi bi-link'
              route : demo:web.home.output/single-line
    -
      title : 文档
      children :
        -
          title : 前端
          children :
            -
              title : 组件
              route : demo:web.js.index
            -
              title : Util 示例
              route : demo:web.js.index?type=util
            -
              title : 上传/图片/视频
              route : demo:web.js.index?type=upload
            -
              title : 表单
              route : demo:web.js.index?type=form
            -
              title : Pjax
              route : demo:web.js.index?type=pjax
            -
              title : Pjax Error(超时)
              route : demo:web.table.pjax_error
        -
          title : 三方资源
          children :
            -
              title : 'Bootstrap Icons'
              url : https://icons.getbootstrap.com/
            -
              title : 'Layui'
              url : https://layui.gitee.io/v2/docs/
              target : '_blank'
            -
              title : 'Layer'
              url : https://layui.gitee.io/v2/layer/
              target : '_blank'
    -
      title : 示例
      children :
        -
          title : 测试邮件
          route : demo:web.mail.index
    -
      title : Table
      children :
        -
          title : 简易表格
          route : demo:web.table.easy
        -
          title : 手动表格
          route : demo:web.table.manual
    -
      title : 搜索
      children :
        -
          title : Where
          icon : 'bi bi-search'
          route : demo:web.search.index/where
        -
          title : Query(默认查询条件)
          route : demo:web.search.index/query
        -
          title : Hidden(隐藏单元)
          route : demo:web.search.index/hidden
        -
          title : Like(模糊查询)
          route : demo:web.search.index/like
        -
          title : Equal(相等)
          route : demo:web.search.index/equal
        -
          title : GT(e)
          route : demo:web.search.index/gt
        -
          title : Lt(e)
          route : demo:web.search.index/lt
        -
          title : With(前缀, 后缀)
          route : demo:web.search.index/with
        -
          title : In
          route : demo:web.search.index/in
        -
          title : Year(年份)
          route : demo:web.search.index/year
        -
          title : Date(日期(天))
          route : demo:web.search.index/date
        -
          title : Month
