backend :
  # 这里的KEY 作为注入项目 poppy.mgr-app/backend||setting, 可以将配置注入到这个地方
  setting :
    title : 配置
    icon : dish
    children :
      -
        title : 主页
        path : home/py-mgr-page:backend.home.cp
      -
        title : 配置
        children :
          -
            title : 系统配置
            path : setting/py-mgr-app:api.home.setting/poppy.mgr-app
            permission : backend:py-system.global.manage
      -
        title : 账号
        children :
          -
            title : 修改密码
            path : form/py-mgr-app:api.user.password
          -
            title : 角色管理
            path : grid/py-mgr-app:api.role.index
          -
            title : 账号管理
            path : grid/py-mgr-app:api.pam.index
          -
            title : 封禁管理
            path : grid/py-mgr-app:api.ban.index
          -
            title : 登录用户
            path : grid/py-mgr-app:api.pam.token
          -
            title : 登录日志
            path : grid/py-mgr-app:api.pam.log
  area :
    title : 地区管理
    # 将当前模块下所有 children 追加到指定key 的 children 中
    injection : 'poppy.mgr-app/backend||setting'
    children :
      -
        title : 地区管理
        children :
          -
            title : 地区管理
            path : grid/py-area:api-backend.content.index
            permission : 'backend:py-area.main.manage'
  ad :
    title : 广告管理
    # 将当前模块下所有 children 追加到指定key 的 children 中
    injection : 'poppy.mgr-app/backend||setting'
    children :
      -
        title : 广告管理
        children :
          -
            title : 广告管理
            path : grid/py-ad:api-backend.place.index
            permission : 'backend:py-ad.place.manage'
  sensitive-word :
    title : 敏感词管理
    # 将当前模块下所有 children 追加到指定key 的 children 中
    injection : 'poppy.mgr-app/backend||setting'
    children :
      -
        title : 敏感词
        children :
          -
            title : 敏感词库
            path : grid/py-sensitive-word:api-backend.word.index
            permission : 'backend:py-sensitive-word.main.manage'
  sms :
    title : 短信管理
    # 将当前模块下所有 children 追加到指定key 的 children 中
    injection : 'poppy.mgr-app/backend||setting'
    children :
      -
        title : 短信管理
        children :
          -
            title : 短信模板
            path : grid/py-sms:api-backend.sms.index
            permission : 'backend:py-sms.sms.manage'